name: Daisy thesis evidence

on:
  push:
    branches: [codex/thesis-final-evidence-20261107]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project and record environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          if [ -d /Applications/Xcode_16.4.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          brew install xcodegen
          xcodegen generate
          git rev-parse HEAD > build/evidence/commit.txt
          xcodebuild -version > build/evidence/xcode-version.txt
          swift --version > build/evidence/swift-version.txt
          sw_vers > build/evidence/macos-version.txt
          xcodegen --version > build/evidence/xcodegen-version.txt
          xcrun simctl list devices available -j > build/evidence/devices.json
          sysctl -n machdep.cpu.brand_string > build/evidence/cpu.txt
          sysctl -n hw.memsize > build/evidence/memory.txt
      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone") and x["isAvailable"]))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '09:41' --batteryState charged --batteryLevel 100
          xcrun simctl ui "$DEVICE_ID" appearance light
          printf '%s\n' "$DEVICE_ID" > build/evidence/selected-device.txt
      - name: Build and run unit and UI tests
        shell: bash
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild test \
            -project Daisy.xcodeproj \
            -scheme Daisy \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/DaisyTests.xcresult \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/evidence/xcodebuild-test.log
      - name: Capture dark appearance with native UI tests
        shell: bash
        run: |
          set -o pipefail
          xcrun simctl ui '${{ steps.simulator.outputs.id }}' appearance dark
          xcodebuild test \
            -project Daisy.xcodeproj -scheme Daisy \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -parallel-testing-enabled NO \
            -only-testing:DaisyUITests/DaisyUITests/testThesisScreenshotsOfImplementedFeatures \
            -resultBundlePath build/DaisyDarkScreens.xcresult \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/evidence/dark-screens.log
      - name: Build distributable iPhone application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -project Daisy.xcodeproj -scheme Daisy -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DeviceBuild \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/evidence/device-build.log
          mkdir -p build/ipa/Payload
          cp -R build/DeviceBuild/Build/Products/Release-iphoneos/Daisy.app build/ipa/Payload/
          (cd build/ipa && zip -qr ../Daisy-thesis-unsigned.ipa Payload)
          shasum -a 256 build/Daisy-thesis-unsigned.ipa > build/evidence/ipa-sha256.txt
      - name: Export test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/evidence/attachments
          if [ -d build/DaisyTests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/DaisyTests.xcresult --format json > build/evidence/test-summary.json || true
            xcrun xcresulttool get test-results tests --path build/DaisyTests.xcresult --format json > build/evidence/test-tree.json || true
            xcrun xcresulttool get object --legacy --path build/DaisyTests.xcresult --format json > build/evidence/test-result-object.json || true
            xcrun xcresulttool export attachments --path build/DaisyTests.xcresult --output-path build/evidence/attachments || true
            xcrun xccov view --report --json build/DaisyTests.xcresult > build/evidence/coverage.json || true
          fi
          if [ -d build/DaisyDarkScreens.xcresult ]; then
            mkdir -p build/evidence/dark-attachments
            xcrun xcresulttool get test-results summary --path build/DaisyDarkScreens.xcresult --format json > build/evidence/dark-summary.json || true
            xcrun xcresulttool export attachments --path build/DaisyDarkScreens.xcresult --output-path build/evidence/dark-attachments || true
          fi
      - name: Upload evidence and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daisy-thesis-evidence-20261107
          path: |
            build/evidence
            build/DaisyTests.xcresult
            build/DaisyDarkScreens.xcresult
            build/Daisy-thesis-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
