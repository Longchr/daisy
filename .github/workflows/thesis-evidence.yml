name: Daisy thesis evidence

on:
  push:
    branches: [codex/thesis-evidence-20260911]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project and record environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          brew install xcodegen
          xcodegen generate
          git rev-parse HEAD > build/evidence/commit.txt
          xcodebuild -version > build/evidence/xcode-version.txt
          swift --version > build/evidence/swift-version.txt
          sw_vers > build/evidence/macos-version.txt
          xcodegen --version > build/evidence/xcodegen-version.txt
          xcrun simctl list devices available -j > build/evidence/devices.json
      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone") and x["isAvailable"]))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '09:41' --batteryState charged --batteryLevel 100
          printf '%s\n' "$DEVICE_ID" > build/evidence/selected-device.txt
      - name: Build and run unit and UI tests
        shell: bash
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild test \
            -project Daisy.xcodeproj \
            -scheme Daisy \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/DaisyTests.xcresult \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/evidence/xcodebuild-test.log
      - name: Export test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/evidence/attachments
          if [ -d build/DaisyTests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/DaisyTests.xcresult --format json > build/evidence/test-summary.json || true
            xcrun xcresulttool get test-results tests --path build/DaisyTests.xcresult --format json > build/evidence/test-tree.json || true
            xcrun xcresulttool get object --legacy --path build/DaisyTests.xcresult --format json > build/evidence/test-result-object.json || true
            xcrun xcresulttool export attachments --path build/DaisyTests.xcresult --output-path build/evidence/attachments || true
            xcrun xccov view --report --json build/DaisyTests.xcresult > build/evidence/coverage.json || true
          fi
      - name: Upload evidence and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daisy-thesis-evidence
          path: |
            build/evidence
            build/DaisyTests.xcresult
          retention-days: 30
          if-no-files-found: error
